  <style>
    /* Critical for Thermal Printing: Remove browser margins/headers */
    @page {
      margin: 0;
      size: auto;
    }

    @media print {
      body * {
        visibility: hidden;
      }

      #receipt-print,
      #receipt-print * {
        visibility: visible;
      }

      #receipt-print {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        margin: 0;
        padding: 0;
      }

      /* Ensure backgrounds render if option not checked in browser */
      * {
        -webkit-print-color-adjust: exact !important;
        /* Chrome, Safari, Edge */
        print-color-adjust: exact !important;
        /* Firefox */
      }
    }
  </style>
  <link rel="stylesheet" href="/index.css">

<body>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(registration => {
            console.log('SW registered: ', registration);
          })
          .catch(registrationError => {
            console.log('SW registration failed: ', registrationError);
          });
      });
    }
  </script>
